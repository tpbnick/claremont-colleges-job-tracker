name: Scrape jobs

on:
  schedule:
    - cron: '0 0,8,16 * * *'   # every 8 hours (00:00, 08:00, 16:00 UTC / PST; 01:00, 09:00, 17:00 PDT)
  workflow_dispatch:           # allow manual run from GitHub Actions UI

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        run: python scripts/claremont_job_tracker.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/claremont_jobs_latest.json data/claremont_jobs_delta.json
          git diff --staged --quiet && echo "No changes to commit." || (git commit -m "chore: update job listings [skip ci]" && git push)
